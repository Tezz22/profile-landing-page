<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <filter id="floppyShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="2" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <linearGradient id="floppyPlastic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2029" />
      <stop offset="100%" stop-color="#121318" />
    </linearGradient>
    <linearGradient id="metalSlider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d0d4de" />
      <stop offset="50%" stop-color="#9ea3b0" />
      <stop offset="100%" stop-color="#6e7380" />
    </linearGradient>
  </defs>

  <g transform="rotate(-12 110 110)" filter="url(#floppyShadow)">
    <!-- Floppy Body (with top-right chamfer corner) -->
    <path d="M 20 20 
             L 182 20 
             L 200 38 
             L 200 200 
             L 20 200 Z" 
          fill="url(#floppyPlastic)" 
          stroke="#2d313e" 
          stroke-width="1.5" />

    <!-- Metal Shutter at Top -->
    <rect x="52" y="20" width="100" height="66" rx="2" ry="2" fill="url(#metalSlider)" stroke="#4a5060" stroke-width="1" />
    <rect x="74" y="32" width="24" height="42" rx="2" ry="2" fill="#121318" />

    <!-- Label Sticker with Pink / Charcoal Zine Style -->
    <rect x="36" y="96" width="148" height="92" rx="3" ry="3" fill="#181a24" stroke="#ff1f71" stroke-width="1.5" />
    <rect x="36" y="96" width="148" height="22" fill="#ff1f71" />
    <text x="110" y="112" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">PROJECT BOOT DISK</text>
    
    <text x="46" y="136" font-family="'Space Mono', monospace" font-size="8.5" fill="#a0a6b5">// YUDA // DEV-01</text>
    <text x="46" y="152" font-family="'Space Mono', monospace" font-size="8.5" fill="#a0a6b5">SECTOR: PNM.TI.D3</text>
    <text x="46" y="168" font-family="'Space Mono', monospace" font-size="8.5" fill="#00f0ff">READ/WRITE: ENABLED</text>

    <!-- Write protect notch slider -->
    <rect x="28" y="180" width="12" height="10" rx="1" ry="1" fill="#0a0b0e" stroke="#2d313e" stroke-width="1" />
    <rect x="180" y="180" width="12" height="10" rx="1" ry="1" fill="#0a0b0e" stroke="#2d313e" stroke-width="1" />
  </g>
</svg>

