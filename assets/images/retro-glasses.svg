<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="340" height="180">
  <defs>
    <!-- Drop Shadow for glasses on desk -->
    <filter id="glassesShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="2" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Red/Amber Tinted Lenses Gradient (Fight Club Tyler Durden signature aesthetic) -->
    <linearGradient id="lensTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.82" />
      <stop offset="50%" stop-color="#e91e63" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ff6d00" stop-opacity="0.7" />
    </linearGradient>

    <!-- Lens Specular Glare -->
    <linearGradient id="lensGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Metallic Wire Frame Gradient -->
    <linearGradient id="wireMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a6229" />
      <stop offset="35%" stop-color="#e5c158" />
      <stop offset="55%" stop-color="#fff0aa" />
      <stop offset="80%" stop-color="#c49a32" />
      <stop offset="100%" stop-color="#544116" />
    </linearGradient>
  </defs>

  <g transform="rotate(8 170 90)" filter="url(#glassesShadow)">
    
    <!-- Wire Temples / Arms (Perspective folded back) -->
    <!-- Left temple -->
    <path d="M 46 72 Q 22 55 12 28 Q 8 20 16 18 Q 24 16 32 30 Q 40 46 54 66" 
          fill="none" stroke="url(#wireMetal)" stroke-width="3" stroke-linecap="round" />
    <!-- Right temple -->
    <path d="M 294 72 Q 318 55 328 28 Q 332 20 324 18 Q 316 16 308 30 Q 300 46 286 66" 
          fill="none" stroke="url(#wireMetal)" stroke-width="3" stroke-linecap="round" />

    <!-- LEFT LENS -->
    <g>
      <!-- Translucent Tinted Glass -->
      <path d="M 52 70 C 52 50, 95 48, 140 52 C 146 53, 148 78, 142 108 C 136 135, 102 144, 76 138 C 54 132, 50 102, 52 70 Z" 
            fill="url(#lensTint)" />
      <!-- Specular Highlight -->
      <path d="M 58 68 C 60 56, 85 54, 115 56 C 102 82, 80 110, 68 126 C 60 114, 58 88, 58 68 Z" 
            fill="url(#lensGlare)" />
      <!-- Wire Rim -->
      <path d="M 52 70 C 52 50, 95 48, 140 52 C 146 53, 148 78, 142 108 C 136 135, 102 144, 76 138 C 54 132, 50 102, 52 70 Z" 
            fill="none" stroke="url(#wireMetal)" stroke-width="3.5" stroke-linejoin="round" />
    </g>

    <!-- RIGHT LENS -->
    <g>
      <!-- Translucent Tinted Glass -->
      <path d="M 288 70 C 288 50, 245 48, 200 52 C 194 53, 192 78, 198 108 C 204 135, 238 144, 264 138 C 286 132, 290 102, 288 70 Z" 
            fill="url(#lensTint)" />
      <!-- Specular Highlight -->
      <path d="M 282 68 C 280 56, 255 54, 225 56 C 238 82, 260 110, 272 126 C 280 114, 282 88, 282 68 Z" 
            fill="url(#lensGlare)" />
      <!-- Wire Rim -->
      <path d="M 288 70 C 288 50, 245 48, 200 52 C 194 53, 192 78, 198 108 C 204 135, 238 144, 264 138 C 286 132, 290 102, 288 70 Z" 
            fill="none" stroke="url(#wireMetal)" stroke-width="3.5" stroke-linejoin="round" />
    </g>

    <!-- DOUBLE NOSE BRIDGE & BROW BAR (Classic Aviator Wire Design) -->
    <!-- Top Brow Bar -->
    <path d="M 125 53 Q 170 48 215 53" 
          fill="none" stroke="url(#wireMetal)" stroke-width="3" stroke-linecap="round" />
    <!-- Lower Curved Nose Bridge -->
    <path d="M 137 66 Q 170 60 203 66" 
          fill="none" stroke="url(#wireMetal)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Silicone Nose Pads -->
    <ellipse cx="152" cy="82" rx="4" ry="7" fill="#ffffff" opacity="0.45" stroke="#7a6229" stroke-width="1" />
    <ellipse cx="188" cy="82" rx="4" ry="7" fill="#ffffff" opacity="0.45" stroke="#7a6229" stroke-width="1" />

    <!-- Hinge Screws / Accents -->
    <circle cx="48" cy="71" r="2.5" fill="#fff0aa" />
    <circle cx="292" cy="71" r="2.5" fill="#fff0aa" />
  </g>
</svg>

