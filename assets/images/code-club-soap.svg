<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <!-- Realistic Soap Drop Shadow -->
    <filter id="soapShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ff1f71" flood-opacity="0.25" />
    </filter>

    <!-- Soap Surface Gradient -->
    <linearGradient id="soapBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d94" />
      <stop offset="35%" stop-color="#ff1f75" />
      <stop offset="70%" stop-color="#e01260" />
      <stop offset="100%" stop-color="#b80948" />
    </linearGradient>

    <!-- Soap Bevel Rim Gradient -->
    <linearGradient id="soapRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff75ae" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff1f75" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#80032c" stop-opacity="0.8" />
    </linearGradient>

    <!-- Inner Emboss Depression Gradient -->
    <linearGradient id="stampDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73052a" />
      <stop offset="100%" stop-color="#d61159" />
    </linearGradient>

    <!-- Specular Sheen -->
    <linearGradient id="sheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g transform="rotate(-5 160 100)">
    <!-- Soap Base Shadow & Outer Hull -->
    <rect x="25" y="32" width="270" height="136" rx="28" ry="28" fill="#7a032b" filter="url(#soapShadow)" />
    
    <!-- Soap Side Thickness (3D Edge) -->
    <rect x="25" y="30" width="270" height="136" rx="28" ry="28" fill="#990638" />
    <rect x="25" y="24" width="270" height="136" rx="28" ry="28" fill="#c40c4d" />

    <!-- Soap Top Main Surface -->
    <rect x="25" y="20" width="270" height="134" rx="26" ry="26" fill="url(#soapBody)" />

    <!-- Beveled Inner Border -->
    <rect x="36" y="30" width="248" height="114" rx="18" ry="18" fill="none" stroke="url(#soapRim)" stroke-width="4" />

    <!-- Surface Sheen Highlight -->
    <path d="M 50 32 Q 160 22 270 34 Q 240 75 160 70 Q 70 75 50 32 Z" fill="url(#sheen)" />

    <!-- Inner Stamp Recess Oval -->
    <rect x="52" y="44" width="216" height="86" rx="12" ry="12" fill="none" stroke="#8c0634" stroke-width="2" opacity="0.6" />

    <!-- EMBOSSED TEXT "CODE CLUB" -->
    <!-- Dark inset shadow (top-left offset) -->
    <text x="160" y="86" 
          font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" 
          font-weight="900" 
          font-size="27" 
          letter-spacing="5" 
          fill="#59021f" 
          text-anchor="middle">CODE</text>
    <text x="160" y="117" 
          font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" 
          font-weight="900" 
          font-size="27" 
          letter-spacing="5" 
          fill="#59021f" 
          text-anchor="middle">CLUB</text>

    <!-- Bottom-right highlight rim for 3D debossed effect -->
    <text x="161.5" y="87.5" 
          font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" 
          font-weight="900" 
          font-size="27" 
          letter-spacing="5" 
          fill="#ff8ab7" 
          text-anchor="middle"
          opacity="0.85">CODE</text>
    <text x="161.5" y="118.5" 
          font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" 
          font-weight="900" 
          font-size="27" 
          letter-spacing="5" 
          fill="#ff8ab7" 
          text-anchor="middle"
          opacity="0.85">CLUB</text>

    <!-- Main Front Stamp Face -->
    <text x="160" y="87" 
          font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" 
          font-weight="900" 
          font-size="27" 
          letter-spacing="5" 
          fill="url(#stampDepth)" 
          text-anchor="middle">CODE</text>
    <text x="160" y="118" 
          font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" 
          font-weight="900" 
          font-size="27" 
          letter-spacing="5" 
          fill="url(#stampDepth)" 
          text-anchor="middle">CLUB</text>

    <!-- Subtle water/moisture bubbles on soap surface -->
    <circle cx="255" cy="52" r="3.5" fill="#ffffff" opacity="0.35" />
    <circle cx="260" cy="57" r="2" fill="#ffffff" opacity="0.25" />
    <circle cx="70" cy="130" r="4" fill="#ffffff" opacity="0.3" />
    <circle cx="65" cy="135" r="2.5" fill="#ffffff" opacity="0.2" />
  </g>
</svg>

